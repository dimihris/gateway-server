spring.application.name=gateway-server

spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8071}

info.app.name=gateway-server
info.app.description=gateway server application
info.app.version=1.0.0

management.info.env.enabled=true
management.endpoint.gateway.access=read-only
management.endpoints.web.exposure.include=*
management.endpoint.shutdown.access=unrestricted

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8070/eureka/

eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

logging.level.com.dimihris.gatewayserver=debug
